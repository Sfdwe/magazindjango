{% extends "app/layout.html" %}

{% block content %}
<div class="container" style="margin-top: 30px; max-width: 800px;">
    <h2>{{ product.title }}</h2>
    <span class="label label-info" style="font-size: 13px; padding: 5px 10px;">{{ product.category.title }}</span>
    <hr />

    <!-- Картинка товара по URL-ссылке -->
    {% if product.image_url %}
    <div style="margin-bottom: 25px; text-align: center;">
        <img src="{{ product.image_url }}" alt="{{ product.title }}" style="max-width: 100%; max-height: 400px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);" />
    </div>
    {% endif %}

    <!-- Блок отображения цены -->
    <div style="margin-bottom: 25px; background: #fdfdfd; padding: 15px; border: 1px solid #e5e5e5; border-radius: 6px; display: inline-block;">
        <h4 style="margin: 0; color: #555; font-size: 16px;">Цена: <strong style="color: #222; font-size: 26px; font-family: 'Playfair Display', serif; margin-left: 10px;">{{ product.price|floatformat:0 }} ₽</strong></h4>
    </div>

    <!-- Полное описание товара -->
    <div style="font-size: 16px; line-height: 1.7; margin-bottom: 40px; color: #444;">
        <h4 style="font-weight: bold;">Описание товара:</h4>
        {{ product.full_description|linebreaks }}
    </div>

    <hr />
    <a href="{% url 'catalog' %}" class="btn btn-default">Назад в каталог</a>
</div>
{% endblock %}
